{{define "style"}}
<style>
  :root {
    --bg: #0f1020;
    --bg2: #1b1035;
    --panel: rgba(255,255,255,0.06);
    --panel-border: rgba(255,255,255,0.10);
    --text: #f2f2f7;
    --muted: #a3a3bd;
    --accent: #1ed760;
    --accent-dark: #17b04e;
    --accent2: #b06cff;
    --warn: #ffb547;
    --danger: #ff5c6c;
    --info: #5cb8ff;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    margin: 0; padding: 1.5rem 1rem 3rem;
    min-height: 100vh;
    background:
      radial-gradient(60rem 40rem at 10% -10%, rgba(176,108,255,0.25), transparent 60%),
      radial-gradient(50rem 35rem at 110% 10%, rgba(30,215,96,0.18), transparent 60%),
      linear-gradient(180deg, var(--bg2), var(--bg) 60%);
    background-attachment: fixed;
    line-height: 1.45;
  }
  a { color: var(--accent); }
  h1, h2, h3, h4 { line-height: 1.2; }
  h3 { margin: 0 0 0.75rem 0; font-size: 1.05rem; letter-spacing: 0.01em; }
  code { background: rgba(255,255,255,0.08); padding: 0.1rem 0.35rem; border-radius: 4px; }

  .page { max-width: 64rem; margin: 0 auto; }
  .page.narrow { max-width: 28rem; margin-top: 3rem; }

  header.top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 0.6rem; margin: 0; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.01em; }
  .brand .logo {
    display: inline-grid; place-items: center; width: 2.4rem; height: 2.4rem; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); font-size: 1.3rem;
    box-shadow: 0 6px 20px rgba(30,215,96,0.3);
  }
  .brand .grad { background: linear-gradient(90deg, #fff, #cbb3ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .you-badge { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.35rem 0.8rem; border-radius: 999px; background: var(--panel); border: 1px solid var(--panel-border); color: var(--muted); font-size: 0.9rem; }
  .you-badge strong { color: var(--text); }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 19rem; gap: 1.25rem; align-items: start; }
  .layout > main { min-width: 0; }
  .sidebar { position: sticky; top: 1rem; max-height: calc(100vh - 2rem); overflow-y: auto; }

  .card {
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: var(--radius);
    padding: 1.1rem 1.25rem; margin-bottom: 1rem;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }
  .card.hero { padding: 1.4rem 1.5rem; }
  .card.err { color: #ffd0d5; background: rgba(255,92,108,0.12); border-color: rgba(255,92,108,0.4); }
  .muted { color: var(--muted); }
  .small { font-size: 0.85rem; }

  .status { display: flex; align-items: center; gap: 0.6rem; font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
  .status .dot { width: 0.7rem; height: 0.7rem; border-radius: 50%; background: var(--muted); flex: none; }
  .status.active { color: var(--accent); }
  .status.active .dot { background: var(--accent); box-shadow: 0 0 0 0 rgba(30,215,96,0.6); animation: pulse 1.6s infinite; }
  .status.reveal { color: var(--warn); }
  .status.reveal .dot { background: var(--warn); }
  .status.waiting { color: var(--muted); }
  .status.waiting .dot { animation: blink 1.4s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(30,215,96,0.6); } 70% { box-shadow: 0 0 0 0.6rem rgba(30,215,96,0); } 100% { box-shadow: 0 0 0 0 rgba(30,215,96,0); } }
  @keyframes blink { 50% { opacity: 0.3; } }

  .eq { display: inline-flex; align-items: flex-end; gap: 3px; height: 1.1rem; margin-left: auto; }
  .eq span { width: 4px; background: var(--accent); border-radius: 2px; animation: eq 0.9s ease-in-out infinite; }
  .eq span:nth-child(2) { animation-delay: -0.3s; }
  .eq span:nth-child(3) { animation-delay: -0.6s; }
  .eq span:nth-child(4) { animation-delay: -0.15s; }
  @keyframes eq { 0%,100% { height: 20%; } 50% { height: 100%; } }

  form.stack { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 0.75rem; }
  label.field { display: flex; flex-direction: column; gap: 0.3rem; font-size: 0.85rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  input[type=text], input[type=number] {
    padding: 0.7rem 0.85rem; font-size: 1.05rem; font-family: inherit; color: var(--text);
    background: rgba(0,0,0,0.25); border: 1px solid var(--panel-border); border-radius: 10px; outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type=text]:focus, input[type=number]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(30,215,96,0.25); }
  input::placeholder { color: #6f6f8a; }

  button {
    padding: 0.65rem 1.1rem; font-size: 1rem; font-weight: 700; font-family: inherit;
    color: #08130c; background: linear-gradient(135deg, var(--accent), #5ef08f);
    border: 0; border-radius: 999px; cursor: pointer;
    transition: transform 0.08s, filter 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 14px rgba(30,215,96,0.3);
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: scale(0.97); }
  button.secondary { color: var(--text); background: rgba(255,255,255,0.10); box-shadow: none; border: 1px solid var(--panel-border); }
  button.danger { color: #fff; background: linear-gradient(135deg, #ff4d63, #ff7a59); box-shadow: 0 4px 14px rgba(255,77,99,0.3); }
  button:disabled { background: #444; color: #999; box-shadow: none; cursor: not-allowed; }
  button.big { padding: 0.85rem 1.2rem; font-size: 1.1rem; }

  table { width: 100%; border-collapse: collapse; }
  th.time, td.time { text-align: right; white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 0.5rem 0.55rem; border-bottom: 1px solid rgba(255,255,255,0.07); font-size: 0.95rem; }
  th { color: var(--muted); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
  td, .wrap { overflow-wrap: anywhere; }
  tr:last-child td { border-bottom: 0; }
  tr.me td { background: rgba(30,215,96,0.10); font-weight: 700; }

  .mark-ok { color: var(--accent); font-weight: 700; }
  .mark-no { color: var(--danger); }
  .count { color: var(--muted); font-size: 0.9rem; }
  .count .answered, .count .players { color: var(--text); font-weight: 700; }

  .progress { height: 6px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; margin-top: 0.4rem; }
  .progress > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 999px; transition: width 0.4s; }

  .countdown { display: inline-flex; align-items: center; gap: 0.4rem; margin-top: 0.75rem; padding: 0.4rem 0.8rem; background: rgba(255,92,108,0.15); color: #ff9aa5; border: 1px solid rgba(255,92,108,0.35); border-radius: 999px; font-weight: 700; font-size: 0.95rem; }
  .countdown .secs { font-variant-numeric: tabular-nums; font-size: 1.1rem; color: #fff; }
  .countdown.results { background: rgba(92,184,255,0.15); color: #a9d8ff; border-color: rgba(92,184,255,0.35); }
  .countdown[hidden] { display: none; }

  .reveal-box { margin: 0.75rem 0; padding: 1rem; border-radius: 12px; background: linear-gradient(135deg, rgba(255,181,71,0.15), rgba(176,108,255,0.15)); border: 1px solid rgba(255,181,71,0.3); }
  .reveal-box .song { font-size: 1.35rem; font-weight: 800; }
  .reveal-box .artist { color: var(--muted); font-size: 1.05rem; }
  .verdict { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem; }
  .chip { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.25rem 0.7rem; border-radius: 999px; font-size: 0.85rem; font-weight: 700; background: rgba(255,255,255,0.08); }
  .chip.ok { background: rgba(30,215,96,0.18); color: var(--accent); }
  .chip.no { background: rgba(255,92,108,0.18); color: #ff9aa5; }

  .pill { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 999px; background: rgba(255,255,255,0.1); font-size: 0.75rem; font-weight: 700; vertical-align: middle; }
  .pill.active { background: rgba(30,215,96,0.2); color: var(--accent); }
  .pill.ended { background: rgba(255,181,71,0.2); color: var(--warn); }
  .pill.prep { background: rgba(92,184,255,0.2); color: var(--info); }

  /* Scoreboard */
  .scores h3 { display: flex; align-items: center; gap: 0.4rem; }
  .scores ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.35rem; }
  .scores li { display: flex; align-items: center; gap: 0.6rem; padding: 0.5rem 0.65rem; border-radius: 10px; background: rgba(255,255,255,0.04); transition: background 0.2s; }
  .scores li.me { background: rgba(30,215,96,0.14); outline: 1px solid rgba(30,215,96,0.4); }
  .scores .rank { flex: none; width: 1.7rem; height: 1.7rem; display: grid; place-items: center; border-radius: 50%; background: rgba(255,255,255,0.08); font-size: 0.8rem; font-weight: 800; color: var(--muted); }
  .scores li:nth-child(1) .rank { background: linear-gradient(135deg, #ffd34d, #f5a623); color: #3b2a00; }
  .scores li:nth-child(2) .rank { background: linear-gradient(135deg, #e6e9f0, #a9b1c2); color: #2a2f3a; }
  .scores li:nth-child(3) .rank { background: linear-gradient(135deg, #e7a46b, #b46a35); color: #2e1606; }
  .scores .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .scores .avg { flex: none; color: var(--muted); font-size: 0.75rem; font-variant-numeric: tabular-nums; }
  .scores .score { font-weight: 800; font-variant-numeric: tabular-nums; font-size: 1.1rem; }
  .scores .empty { color: var(--muted); font-size: 0.9rem; }
  .scores form { display: inline; margin: 0; }
  .scores button.eject { padding: 0.15rem 0.5rem; font-size: 0.7rem; }

  @media (max-width: 48rem) {
    body { padding-top: 0.75rem; }
    .layout { grid-template-columns: 1fr; gap: 0; }
    /* On phones the scoreboard becomes a compact strip pinned to the top so
       scores stay on screen while the player types. */
    .sidebar { order: -1; position: sticky; top: 0; z-index: 5; max-height: none; overflow: visible; margin: 0 -1rem 1rem; }
    .sidebar .scores { margin: 0; border-radius: 0; border-left: 0; border-right: 0; padding: 0.55rem 0.75rem; background: rgba(15,16,32,0.85); }
    .sidebar .scores h3 { display: none; }
    .sidebar .scores ol { flex-direction: row; overflow-x: auto; gap: 0.4rem; scrollbar-width: none; }
    .sidebar .scores ol::-webkit-scrollbar { display: none; }
    .sidebar .scores li { flex: none; padding: 0.3rem 0.6rem 0.3rem 0.35rem; border-radius: 999px; gap: 0.4rem; }
    .sidebar .scores .rank { width: 1.4rem; height: 1.4rem; font-size: 0.7rem; }
    .sidebar .scores .name { max-width: 7rem; font-size: 0.9rem; }
    .sidebar .scores .score { font-size: 0.95rem; }
    .sidebar .scores .avg { display: none; }
  }
</style>
{{end}}
