<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Join the song game</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
{{template "style"}}
<style>
  .join { display: flex; gap: 0.5rem; margin-top: 1rem; }
  .join input { flex: 1; min-width: 0; }
</style>
</head>
<body>
<div class="page narrow">
  <h1 class="brand" style="justify-content:center; margin-bottom:1.25rem;"><span class="logo">🎵</span><span class="grad">Guess that song</span></h1>
  <div class="card hero">
    <h3>Ready to play?</h3>
    <p class="muted" style="margin:0;">Enter your name to join.</p>
    <form class="join" method="post" action="/join">
      <input type="text" name="name" placeholder="Your name" autofocus required maxlength="40">
      <button type="submit">Join</button>
    </form>
  </div>
</div>
</body>
</html>
